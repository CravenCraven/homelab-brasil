apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared-brasil
data:
  config.yaml: |
    tunnel: brasil
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: musica.projectpattie.com
      service: http://navidrome.brasil.svc.cluster.local:80
    - service: http_status:404
