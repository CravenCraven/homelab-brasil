apiVersion: batch/v1
kind: CronJob
metadata:
  name: fsi-scraper-conversa
  namespace: brasil
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      completionMode: NonIndexed
      completions: 1
      manualSelector: false
      parallelism: 1
      podReplacementPolicy: TerminatingOrFailed
      suspend: false
      template:
        spec:
          containers:
          - args:
            - fsi-scraper fetch --course conversa-brasileira --out /corpus/raw --cache
              /corpus/cache && fsi-scraper load --course conversa-brasileira --raw /corpus/raw
              --cache /corpus/cache
            command:
            - sh
            - -c
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: corpus-db-app
            image: ghcr.io/cravencraven/fsi-scraper:8fa4ee0
            imagePullPolicy: IfNotPresent
            name: scraper
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /corpus
              name: corpus
          dnsPolicy: ClusterFirst
          nodeSelector:
            workload: heavy
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
          terminationGracePeriodSeconds: 30
          volumes:
          - name: corpus
            persistentVolumeClaim:
              claimName: fsi-audio
