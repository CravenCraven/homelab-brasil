apiVersion: apps/v1
kind: Deployment
metadata:
  name: brasil-portal
  namespace: brasil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brasil-portal
  template:
    metadata:
      labels:
        app: brasil-portal
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: brasil-portal
          image: ghcr.io/cravencraven/brasil-portal:dev
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corpus-db-app
                  key: uri
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: brasil-portal
  namespace: brasil
spec:
  selector:
    app: brasil-portal
  ports:
    - port: 80
      targetPort: 8000
